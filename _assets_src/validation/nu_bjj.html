    &lt;!-- Что такое БЖЖ --&gt;
    &lt;section class=&quot;section&quot; id=&quot;about-bjj&quot;&gt;

          &lt;div class=&quot;about__text&quot;&gt;
            &lt;h2 class=&quot;section__title&quot;&gt;Что такое БЖЖ&lt;/h2&gt;
            &lt;p&gt;Бразильское джиу-джитсу — боевое искусство и единоборство. Основной акцент в нём сделан на борьбе в партере, то есть на земле: спортсмены используют болевые и удушающие приёмы.&lt;/p&gt;
            &lt;p&gt;Техника и рычаги позволяют побеждать более тяжёлого соперника. Тренироваться можно в кимоно (ги) и без него (no-gi), в рашгарде.&lt;/p&gt;
          &lt;/div&gt;
          &lt;div class=&quot;about__text note-card&quot;&gt;
            &lt;h3&gt;Кому подойдёт&lt;/h3&gt;
            &lt;ul class=&quot;checklist&quot;&gt;
              &lt;li&gt;Новичкам с нуля&lt;/li&gt;
              &lt;li&gt;Детям (есть отдельные группы)&lt;/li&gt;
              &lt;li&gt;Тем, кто хочет научиться самообороне&lt;/li&gt;
              &lt;li&gt;Спортсменам ММА&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

              &lt;li&gt;Вода&lt;/li&gt;

    &lt;!-- Форма записи --&gt;
    &lt;section class=&quot;section&quot; id=&quot;signup&quot;&gt;
      &lt;div class=&quot;container&quot;&gt;
        &lt;h2 class=&quot;section__title&quot;&gt;Запись на пробную тренировку&lt;/h2&gt;
        &lt;p class=&quot;lead&quot;&gt;Заполните форму, и администратор перезвонит, чтобы подтвердить время.&lt;/p&gt;

        &lt;div class=&quot;signup&quot;&gt;
          &lt;form class=&quot;form&quot; action=&quot;thanks.html&quot; method=&quot;get&quot;&gt;
            &lt;p class=&quot;form__note&quot;&gt;Поля, отмеченные звёздочкой (&lt;span aria-hidden=&quot;true&quot;&gt;*&lt;/span&gt;), обязательны для заполнения.&lt;/p&gt;

            &lt;!-- Контакты --&gt;
            &lt;fieldset class=&quot;form__group&quot;&gt;
              &lt;legend&gt;Контакты&lt;/legend&gt;
              &lt;div class=&quot;form__row&quot;&gt;
                &lt;div class=&quot;field&quot;&gt;
                  &lt;label for=&quot;name&quot;&gt;Имя &lt;span aria-hidden=&quot;true&quot;&gt;*&lt;/span&gt;&lt;/label&gt;
                  &lt;input id=&quot;name&quot; name=&quot;name&quot; type=&quot;text&quot; required minlength=&quot;2&quot; autocomplete=&quot;name&quot; placeholder=&quot;Как к вам обращаться&quot; aria-describedby=&quot;name-hint&quot;&gt;
                  &lt;small id=&quot;name-hint&quot; class=&quot;hint&quot;&gt;Не короче двух символов&lt;/small&gt;
                &lt;/div&gt;
                &lt;div class=&quot;field&quot;&gt;
                  &lt;label for=&quot;phone&quot;&gt;Телефон &lt;span aria-hidden=&quot;true&quot;&gt;*&lt;/span&gt;&lt;/label&gt;
                  &lt;input id=&quot;phone&quot; name=&quot;phone&quot; type=&quot;tel&quot; required pattern=&quot;\+?[0-9\s\-\(\)]{10,18}&quot; autocomplete=&quot;tel&quot; placeholder=&quot;+7 999 123-45-67&quot; aria-describedby=&quot;phone-hint&quot;&gt;
                  &lt;small id=&quot;phone-hint&quot; class=&quot;hint&quot;&gt;Например: +7 999 123-45-67&lt;/small&gt;
                &lt;/div&gt;
              &lt;/div&gt;
              &lt;div class=&quot;field&quot;&gt;
                &lt;label for=&quot;email&quot;&gt;E-mail&lt;/label&gt;
                &lt;input id=&quot;email&quot; name=&quot;email&quot; type=&quot;email&quot; autocomplete=&quot;email&quot; placeholder=&quot;name@example.ru&quot; aria-describedby=&quot;email-hint&quot;&gt;
                &lt;small id=&quot;email-hint&quot; class=&quot;hint&quot;&gt;Необязательное поле&lt;/small&gt;
              &lt;/div&gt;
            &lt;/fieldset&gt;

            &lt;!-- Тренировка --&gt;
            &lt;fieldset class=&quot;form__group&quot;&gt;
              &lt;legend&gt;Тренировка&lt;/legend&gt;
              &lt;div class=&quot;form__row&quot;&gt;
                &lt;div class=&quot;field&quot;&gt;
                  &lt;label for=&quot;group&quot;&gt;Группа &lt;span aria-hidden=&quot;true&quot;&gt;*&lt;/span&gt;&lt;/label&gt;
                  &lt;select id=&quot;group&quot; name=&quot;group&quot; required&gt;
                    &lt;option value=&quot;&quot;&gt;Выберите группу&lt;/option&gt;
                    &lt;option value=&quot;adults&quot;&gt;Взрослые&lt;/option&gt;
                    &lt;option value=&quot;kids&quot;&gt;Дети&lt;/option&gt;
                  &lt;/select&gt;
                &lt;/div&gt;
                &lt;div class=&quot;field&quot;&gt;
                  &lt;label for=&quot;time&quot;&gt;Удобное время&lt;/label&gt;
                  &lt;select id=&quot;time&quot; name=&quot;time&quot;&gt;
                    &lt;option value=&quot;any&quot;&gt;Не важно&lt;/option&gt;
                    &lt;option value=&quot;morning&quot;&gt;Утро&lt;/option&gt;
                    &lt;option value=&quot;day&quot;&gt;День&lt;/option&gt;
                    &lt;option value=&quot;evening&quot;&gt;Вечер&lt;/option&gt;
                    &lt;option value=&quot;weekend&quot;&gt;Выходные&lt;/option&gt;
                  &lt;/select&gt;
                &lt;/div&gt;
              &lt;/div&gt;

              &lt;fieldset class=&quot;radios&quot;&gt;
